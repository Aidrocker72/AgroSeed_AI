[tool.poetry]
name = "agroseed-ai-service"
version = "1.0.0"
description = "AI Service for AgroSeed AI system"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
pandas = "^2.1.3"
numpy = "^1.26.2"
scikit-learn = "^1.3.2"
prophet = "^1.1.5"
joblib = "^1.3.2"
httpx = "^0.25.2"
celery = "^5.3.4"
redis = "^5.0.1"
matplotlib = "^3.8.2"
seaborn = "^0.13.0"
plotly = "^5.18.0"
statsmodels = "^0.14.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.2"
testcontainers = "^3.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]