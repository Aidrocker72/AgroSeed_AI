[tool.poetry]
name = "agroseed-etl-service"
version = "1.0.0"
description = "ETL Service for AgroSeed AI system"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
sqlalchemy = "^2.0.23"
asyncpg = "^0.29.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
alembic = "^1.13.1"
httpx = "^0.25.2"
aiohttp = "^3.9.1"
apscheduler = "^3.10.4"
feedparser = "^6.0.10"
requests = "^2.31.0"
pandas = "^2.1.3"
numpy = "^1.26.2"
celery = "^5.3.4"
redis = "^5.0.1"
beautifulsoup4 = "^4.12.2"
lxml = "^4.9.3"
python-dateutil = "^2.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
httpx = "^0.25.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]